<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>docx-editor render harness</title>
    <style>
      html, body { margin: 0; padding: 0; background: #fff; }
      /* Strip the editor chrome so the screenshot is just the page(s),
         comparable to MS Word's print render and our canvas capture. */
      #container { background: #fff; }
      #status { position: fixed; bottom: 2px; right: 4px; font: 10px monospace; color: #999; }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div id="status">booting…</div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
