<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Excel Interface - RedBat.Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #e8e8e8;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .title-bar {
            background: #ffffff;
            padding: 8px 12px;
            border-bottom: 1px solid #dadce0;
            font-size: 14px;
            font-weight: 600;
            color: #202124;
        }

        .formula-bar-container {
            background: #ffffff;
            border-bottom: 1px solid #dadce0;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #ffffff;
        }

        #spreadsheet-root {
            flex: 1;
            overflow: auto;
        }

        .status-bar {
            background: #ffffff;
            border-top: 1px solid #dadce0;
            padding: 4px 12px;
            font-size: 11px;
            color: #5f6368;
            display: flex;
            justify-content: space-between;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sheet-tool-button:active {
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.12);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Title Bar -->
        <div class="title-bar">
            RedBat.Grid - Full Excel Interface Demo
        </div>

        <!-- Shell (menubar + unified toolbar + inline find/replace) -->
        <div id="shell-container"></div>

        <!-- Formula Bar -->
        <div class="formula-bar-container" id="formula-bar-container"></div>

        <!-- Spreadsheet Content -->
        <div class="content">
            <div id="spreadsheet-root"></div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <span id="status-message">Ready</span>
            </div>
            <div class="status-item">
                <span id="cell-count">0 cells</span>
                <span>|</span>
                <span id="selection-info">No selection</span>
            </div>
        </div>
    </div>

    <script type="module">
        // Import the compiled Fable modules
        import createSpreadsheet from './../../hosts/mega/frontend/src/lib/grid/Spreadsheet/Spreadsheet.js';
        import {
            createSpreadsheetShell,
            createFormulaBar
        } from './../../hosts/mega/frontend/src/lib/grid/Spreadsheet/Toolbar.js';

        // Create spreadsheet
        const spreadsheetContainer = document.getElementById('spreadsheet-root');
        const spreadsheet = createSpreadsheet(spreadsheetContainer);
        spreadsheet.Mount();

        // ===== FORMULA BAR =====

        const formulaBarContainer = document.getElementById('formula-bar-container');
        const formulaBar = createFormulaBar(
            (ref) => { console.log('Cell ref changed:', ref); },
            (formula) => { console.log('Formula changed:', formula); },
            () => {
                const formula = document.querySelector('.formula-input').value;
                spreadsheet.SetCurrentCellFromFormula(formula);
                updateFormulaBar();
            }
        );
        formulaBar.Mount(formulaBarContainer);

        function updateFormulaBar() {
            const cellRef = spreadsheet.GetSelectionRef();
            const formula = spreadsheet.GetCurrentCellFormula();
            formulaBar.SetCellRef(cellRef);
            formulaBar.SetFormula(formula);
            document.getElementById('selection-info').textContent = `Selection: ${cellRef}`;
        }

        updateFormulaBar();
        setInterval(updateFormulaBar, 100);

        // ===== UNIFIED SHELL =====
        // One menubar + one toolbar row. All actions flow through a single
        // dispatch function; find/replace is owned by the shell and toggled
        // via Edit > Find or Ctrl+F.

        const promptIndex = (verb, kind) => {
            const value = prompt(`${verb} ${kind} at index (0-based):`);
            return value === null ? null : parseInt(value);
        };

        const dispatchAction = (action) => {
            console.log('Action:', action);
            switch (action) {
                case 'textColor':      spreadsheet.ApplyTextColor('#ff0000'); updateStatus('Applied text color'); break;
                case 'bgColor':        spreadsheet.ApplyBgColor('#ffff00'); updateStatus('Applied background color'); break;
                case 'formatNumber':   spreadsheet.ApplyNumberFormat('number'); updateStatus('Applied number format'); break;
                case 'formatCurrency': spreadsheet.ApplyNumberFormat('currency'); updateStatus('Applied currency format'); break;
                case 'formatPercent':  spreadsheet.ApplyNumberFormat('percentage'); updateStatus('Applied percentage format'); break;
                case 'cut':            spreadsheet.Cut(); updateStatus('Cut to clipboard'); break;
                case 'copy':           spreadsheet.Copy(); updateStatus('Copied to clipboard'); break;
                case 'paste':          spreadsheet.Paste(); updateStatus('Pasted from clipboard'); break;
                case 'undo':           spreadsheet.Undo(); updateStatus('Undo'); break;
                case 'redo':           spreadsheet.Redo(); updateStatus('Redo'); break;
                case 'sortAsc':        spreadsheet.SortCurrentColumnAsc(); updateStatus('Sorted ascending'); break;
                case 'sortDesc':       spreadsheet.SortCurrentColumnDesc(); updateStatus('Sorted descending'); break;
                case 'filter':         updateStatus('Filter not yet implemented'); break;
                case 'clearFilter':    updateStatus('Clear filter not yet implemented'); break;
                case 'insertRow': {
                    const idx = promptIndex('Insert', 'row');
                    if (idx !== null) { spreadsheet.InsertRow(idx); updateStatus(`Inserted row at ${idx}`); }
                    break;
                }
                case 'deleteRow': {
                    const idx = promptIndex('Delete', 'row');
                    if (idx !== null) { spreadsheet.DeleteRow(idx); updateStatus(`Deleted row ${idx}`); }
                    break;
                }
                case 'insertColumn': {
                    const idx = promptIndex('Insert', 'column');
                    if (idx !== null) { spreadsheet.InsertColumn(idx); updateStatus(`Inserted column at ${idx}`); }
                    break;
                }
                case 'deleteColumn': {
                    const idx = promptIndex('Delete', 'column');
                    if (idx !== null) { spreadsheet.DeleteColumn(idx); updateStatus(`Deleted column ${idx}`); }
                    break;
                }
                case 'open':
                case 'save':
                case 'printPdf':
                    updateStatus(`${action} not yet implemented`);
                    break;
                default:
                    spreadsheet.ApplyFormat(action);
                    updateStatus(`Applied format: ${action}`);
            }
        };

        const shell = createSpreadsheetShell(
            dispatchAction,
            (query) => {
                spreadsheet.StartSearch(query, false);
                const count = spreadsheet.GetSearchResultsCount();
                updateStatus(`Found ${count} result(s)`);
                if (count > 0) spreadsheet.FindNext();
            },
            ([find, replace]) => {
                spreadsheet.ReplaceAll(find, replace, false);
                updateStatus(`Replaced all "${find}" with "${replace}"`);
            }
        );
        shell.Mount(document.getElementById('shell-container'));

        // Ctrl+F opens the find/replace bar.
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'f') {
                e.preventDefault();
                shell.ShowFindReplace();
            }
        });

        // ===== STATUS BAR =====

        function updateStatus(message) {
            document.getElementById('status-message').textContent = message;
            setTimeout(() => {
                document.getElementById('status-message').textContent = 'Ready';
            }, 3000);
        }

        // ===== SAMPLE DATA =====

        // Add headers
        spreadsheet.SetCell(0, 0, "Product");
        spreadsheet.SetCell(0, 1, "Price");
        spreadsheet.SetCell(0, 2, "Quantity");
        spreadsheet.SetCell(0, 3, "Total");
        spreadsheet.SetCell(0, 4, "Status");

        // Add data rows
        const products = [
            ["Widget A", "19.99", "150", "=B2*C2", "In Stock"],
            ["Gadget B", "29.99", "75", "=B3*C3", "Low Stock"],
            ["Tool C", "49.99", "200", "=B4*C4", "In Stock"],
            ["Device D", "99.99", "50", "=B5*C5", "In Stock"],
            ["Item E", "9.99", "500", "=B6*C6", "In Stock"]
        ];

        products.forEach((row, idx) => {
            row.forEach((cell, colIdx) => {
                spreadsheet.SetCell(idx + 1, colIdx, cell);
            });
        });

        // Add totals row
        spreadsheet.SetCell(6, 0, "TOTAL");
        spreadsheet.SetCell(6, 3, "=SUM(D2:D6)");

        // Format header row (bold)
        for (let col = 0; col < 5; col++) {
            spreadsheet.SelectCell(0, col);
            spreadsheet.ApplyFormat('bold');
        }

        // Format price columns as currency
        for (let row = 1; row <= 6; row++) {
            spreadsheet.SelectCell(row, 1);
            spreadsheet.ApplyNumberFormat('currency');
            if (row !== 6) {  // Skip total row for column D formatting
                spreadsheet.SelectCell(row, 3);
                spreadsheet.ApplyNumberFormat('currency');
            }
        }

        // Format total row (bold, currency)
        spreadsheet.SelectCell(6, 3);
        spreadsheet.ApplyFormat('bold');
        spreadsheet.ApplyNumberFormat('currency');

        console.log('Full Excel interface loaded!');
        console.log('');
        console.log('Try these features:');
        console.log('1. Click on cells and edit in formula bar');
        console.log('2. Use toolbar buttons for formatting');
        console.log('3. Cut/Copy/Paste from the toolbar or Edit menu');
        console.log('4. Sort columns from the Data menu');
        console.log('5. Press Ctrl+F to open Find/Replace');
        console.log('6. Insert/Delete rows and columns from the Insert menu');
        console.log('7. Undo/Redo from the toolbar or Edit menu');
    </script>
</body>
</html>
