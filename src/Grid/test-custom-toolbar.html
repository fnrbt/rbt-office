<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Toolbar Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: #2c3e50;
            color: white;
            padding: 20px;
        }

        .sidebar h2 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .sidebar .toolbar-section {
            margin-bottom: 30px;
        }

        .sidebar .toolbar-section h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #95a5a6;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .top-toolbar {
            background: #ecf0f1;
            padding: 10px;
            border-bottom: 1px solid #bdc3c7;
        }

        .spreadsheet-area {
            flex: 1;
            padding: 20px;
            background: #f5f5f5;
        }

        /* Override toolbar button styles for sidebar */
        .sidebar .toolbar {
            background: transparent;
            border: none;
            padding: 0;
            flex-direction: column;
            align-items: stretch;
        }

        .sidebar .toolbar-button {
            margin: 4px 0 !important;
            justify-content: flex-start;
            background: #34495e !important;
            color: white !important;
            border: 1px solid #2c3e50 !important;
        }

        .sidebar .toolbar-button:hover {
            background: #3d566e !important;
        }

        .sidebar .toolbar-separator {
            display: none;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Spreadsheet Tools</h2>

        <div class="toolbar-section">
            <h3>TEXT FORMATTING</h3>
            <div id="sidebar-format-toolbar"></div>
        </div>

        <div class="toolbar-section">
            <h3>ALIGNMENT</h3>
            <div id="sidebar-alignment-toolbar"></div>
        </div>
    </div>

    <div class="main">
        <div class="top-toolbar" id="top-toolbar">
            <!-- Number formatting toolbar goes here -->
        </div>

        <div class="spreadsheet-area">
            <div id="spreadsheet-root"></div>
        </div>
    </div>

    <script type="module">
        // Import the compiled Fable modules
        import createSpreadsheet from './../../hosts/mega/frontend/src/lib/grid/Spreadsheet/Spreadsheet.js';
        import { createFormatToolbar, createAlignmentToolbar, createNumberFormatToolbar } from './../../hosts/mega/frontend/src/lib/grid/Spreadsheet/Toolbar.js';

        // Create spreadsheet
        const spreadsheetContainer = document.getElementById('spreadsheet-root');
        const spreadsheet = createSpreadsheet(spreadsheetContainer);
        spreadsheet.Mount();

        // Create and place format toolbar in sidebar
        const formatToolbar = createFormatToolbar((action) => {
            console.log('Format action:', action);
            if (action === 'textColor') {
                spreadsheet.ApplyTextColor('#e74c3c');
            } else if (action === 'bgColor') {
                spreadsheet.ApplyBgColor('#f39c12');
            } else {
                spreadsheet.ApplyFormat(action);
            }
        });
        formatToolbar.Mount(document.getElementById('sidebar-format-toolbar'));

        // Create and place alignment toolbar in sidebar
        const alignmentToolbar = createAlignmentToolbar((action) => {
            console.log('Alignment action:', action);
            spreadsheet.ApplyFormat(action);
        });
        alignmentToolbar.Mount(document.getElementById('sidebar-alignment-toolbar'));

        // Create and place number toolbar in top bar
        const numberToolbar = createNumberFormatToolbar((action) => {
            console.log('Number format action:', action);
            if (action === 'formatNumber') {
                spreadsheet.ApplyNumberFormat('number');
            } else if (action === 'formatCurrency') {
                spreadsheet.ApplyNumberFormat('currency');
            } else if (action === 'formatPercent') {
                spreadsheet.ApplyNumberFormat('percent');
            }
        });
        numberToolbar.Mount(document.getElementById('top-toolbar'));

        // Sample data
        spreadsheet.SetCell(0, 0, "Product");
        spreadsheet.SetCell(0, 1, "Price");
        spreadsheet.SetCell(0, 2, "Quantity");
        spreadsheet.SetCell(0, 3, "Total");

        spreadsheet.SetCell(1, 0, "Widget");
        spreadsheet.SetCell(1, 1, "12.99");
        spreadsheet.SetCell(1, 2, "5");
        spreadsheet.SetCell(1, 3, "=B2*C2");

        spreadsheet.SetCell(2, 0, "Gadget");
        spreadsheet.SetCell(2, 1, "24.99");
        spreadsheet.SetCell(2, 2, "3");
        spreadsheet.SetCell(2, 3, "=B3*C3");

        console.log('Custom toolbar layout demo ready!');
        console.log('Notice: Format/Alignment toolbars in sidebar, Number toolbar in top bar');
    </script>
</body>
</html>
